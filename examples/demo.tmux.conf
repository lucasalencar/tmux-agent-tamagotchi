# A throwaway tmux server with tmux-agent-tamagotchi loaded, for trying the
# plugin out without touching your own configuration.
#
#   cd /path/to/tmux-agent-tamagotchi
#   tmux -L tama-demo -f examples/demo.tmux.conf new-session -d -s demo
#   tmux -L tama-demo attach -t demo
#
# Started from anywhere else, point TAMA_DEMO_PLUGIN_DIR at the clone:
#
#   TAMA_DEMO_PLUGIN_DIR=/path/to/tmux-agent-tamagotchi \
#     tmux -L tama-demo -f examples/demo.tmux.conf new-session -d -s demo
#
# Tear it down with: tmux -L tama-demo kill-server

# The plugin exports format strings; where they go in the status line is your
# decision. #{E:...} expands the option's own format, which is what turns
# @tama_icons into one icon per agent pane and @tama_flag into the mark on
# windows that want attention.
# tmux's own default is '#I:#W#{?window_flags,#{window_flags}, }' — keep the
# window_flags, or the plugin's flag arrives at the cost of tmux's zoom and bell
# markers. Without the space tmux pads them with, though: the icons bring their
# own, and two of them would shift the column as flags come and go.
set -g window-status-format '#I:#{E:@tama_priority}#W#{?window_flags,#{window_flags},}#{E:@tama_icons}#{E:@tama_flag}'
set -g window-status-current-format '#I:#{E:@tama_priority}#W#{?window_flags,#{window_flags},}#{E:@tama_icons}#{E:@tama_flag}'

# Priority mode is activated by the first Priority tmux window and deactivated by
# removing the last one. This binding always passes the selected window explicitly.
# bind-key P run-shell '#{q:@tama_bin} toggle-priority --window #{q:window_id}'

# The icons are also pushed by the plugin whenever a state changes, so this is
# only the fallback refresh rate.
set -g status-interval 5

# An agent that dies without saying so would leave its icon behind, so the plugin
# sweeps: the window you are looking at on every window and pane selection, and
# every window on the server when you come back to it. Coming back is also what
# takes the mark off a window you attached to without ever selecting it. Attaching
# needs nothing from you; the other way back — your terminal regaining focus while
# already attached — tmux only notices if you ask it to listen, which is this line
# and nothing the plugin will do to your config for you.
set -g focus-events on

# The session name in the terminal window's title, which is how a backend recognises
# the window showing a session: it is what lets the plugin stay quiet when you are
# already looking at the window, and what lets a click bring the right window forward.
# Not the plugin's to set in your own config either, so it is here to be copied.
set -g set-titles on
set -g set-titles-string '#S'

# Which commands count as "no agent is in here any more" — a pane back at one of
# these is what the sweep accepts as evidence that the agent has gone. The default
# covers the usual shells.
# set -g @tama_gc_shells 'sh bash zsh fish dash ksh mksh ash csh tcsh'

# The icons are yours. Uncomment anything here, then `tmux -L tama-demo
# source-file examples/demo.tmux.conf`: every option is read on every redraw, so
# a change lands on the next tick with no server restart.
#
# A whole set at once — 'glyphs' (the default: ● ◐ ⚙ ○ ✕), 'ascii' (* ? + . !)
# for terminals with no wide-glyph support, or 'pets' (🐥 🍼 🥚 😴 💀) for the
# joke the plugin is named after. The pet emoji are double width: they cost a
# column each, so a status line full of windows truncates sooner, and not every
# terminal measures them the way tmux does.
# set -g @tama_icon_set pets
#
# Or one state at a time. An individual icon always wins over the set, so this
# is a way to change one glyph without giving up the rest.
# set -g @tama_icon_running '▶'
# set -g @tama_icon_waiting '?'
# set -g @tama_icon_background '~'
# set -g @tama_icon_idle 'o'
# set -g @tama_icon_error 'x'
#
# Icons you do not act on can go. 'off' hides the idle ones; for background it
# means "do not distinguish" instead — those panes draw as running, because the
# agent is working either way.
# set -g @tama_show_idle off
# set -g @tama_show_background off
#
# And the spacing around them. The prefix is drawn only when there is an icon to
# draw, so an ordinary window is never padded; set it to '' for none at all.
# set -g @tama_icon_prefix ' '
# set -g @tama_icon_separator '|'
# set -g @tama_icon_suffix ''

# Banners. With nothing set here, `@tama_backend auto` picks a backend whose
# dependency is actually installed on this machine: on a Mac with terminal-notifier
# that is real banners in Notification Center, on a Linux desktop with notify-send it is
# your notification daemon, and where there is neither it is the no-op one — silent
# rather than broken. Flags follow their own Priority and observation policy, independently
# of whether a banner is delivered. On Linux a banner cannot
# be clicked back to its pane and cannot be taken down early; see backends/README.md.
#
# To see what a banner would have said and where a click would have gone *without*
# raising one, point the backend at a directory of your own. Any four executables will
# do:
#
#   mkdir -p /tmp/tama-demo-backend
#   printf '#!/bin/sh\nprintf "%%s | %%s\\n" "$1" "$2" >>/tmp/tama-demo.log\n' \
#     >/tmp/tama-demo-backend/notify
#   chmod +x /tmp/tama-demo-backend/notify
#   tmux -L tama-demo set -g @tama_backend /tmp/tama-demo-backend
#
# Then, from a pane on this server:
#
#   "$(tmux -L tama-demo show -gqv @tama_bin)" notify my-agent 'a question for you'
#
# set -g @tama_notifications off   # heads-down: the icons and the mark stay
#
# The title is a real tmux format string, expanded against the pane that spoke. The
# default is the agent's name and the pane's directory; write anything tmux can
# express instead, including conditionals. @tama_pane_agent and @tama_pane_label are
# the two things only the plugin knows.
# set -g @tama_title_format '#{@tama_pane_agent} in #{b:pane_current_path}'
#
# Your own window-naming tooling, if you have some: it is given the window id, and
# its first line of output is available to the title as @tama_pane_label. Unset
# means nothing is ever run.
# set -g @tama_label_command '~/bin/my-window-label'

# What a TPM install does with `set -g @plugin`, spelled out. The explicit
# `sh -c` is there because tmux runs this through your login shell, and fish and
# csh cannot expand `${VAR:-default}`. $PWD is the working directory of whoever
# started the server, so the bare form only works for a server started from the
# clone; anywhere else, set TAMA_DEMO_PLUGIN_DIR.
run-shell "sh -c '\"\${TAMA_DEMO_PLUGIN_DIR:-\$PWD}/tamagotchi.tmux\"'"
