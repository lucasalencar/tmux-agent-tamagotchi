name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms, because the two shellchecks disagree: the version Ubuntu
        # ships and the version Homebrew ships flag different things, and code that
        # only ever saw one of them acquires warnings the other rejects.
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Report versions
        run: shellcheck --version
      - run: make lint

  test:
    name: bats (${{ matrix.os }}, shard ${{ matrix.shard }}/2, jobs 4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than a -latest: the suite needs bats >= 1.7, and which bats a
        # package manager has is a property of the image.
        #
        # The macOS leg is not a portability nicety. Every script here is written for
        # bash 3.2.57 — the bash macOS ships and the one an agent's hook will run under
        # there — and `tama_use_bash_32_or_skip` is how the suite checks it. There is no
        # bash 3.2 on a Linux runner, so those tests *skip* on the Linux leg: without
        # this leg nothing anywhere verifies the constraint the whole codebase is
        # written for. It is also the only leg that can run the macOS backend's tests.
        #
        # What it deliberately does not verify is a desktop. A runner has no terminal
        # application and no Notification Center, so the two capabilities that talk to
        # one — `focused` saying the terminal is in front, `focus` bringing a window
        # forward — are only exercised in the direction that needs no GUI. The other
        # direction is verified by hand; see tests/macos.bats.
        #
        # The Linux leg has the same shape of gap and one less way to close it: there is
        # no notification daemon on a runner and no Linux desktop on this project's
        # development machine, so `backends/libnotify` is asserted against a fake
        # `notify-send` — the command line it is handed, never a banner. It is the only
        # leg that can decide what `auto` resolves to off a Mac. See tests/linux.bats.
        os: [ubuntu-24.04, macos-15]
        # Two shards × 4 in-VM jobs (rush): fewer VMs than the 4-shard setup,
        # same total parallelism, less macOS queue risk. Within a shard, files
        # run in parallel but each file's tests stay serial
        # (--no-parallelize-within-files), the exact semantics of serial runs.
        # Validated locally 3× with 0 failures; CI is the final judge (this line).
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux, bats and jq (Linux)
        # No libnotify-bin, for the reason there is no terminal-notifier below: a real
        # `notify-send` would give any test that reaches the notify path a live D-Bus call
        # to make. Nothing depends on whether the image happens to carry one — every test
        # that resolves `auto` names its own `notify-send`, present or absent, through
        # `@tama_notify_send` or a fixture on PATH.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bats jq
      - name: Install tmux, bats and jq (macOS)
        # No terminal-notifier: `auto` must resolve to the no-op backend on a machine
        # with no notifier, and that is a claim the suite makes. The macOS backend's own
        # tests point `@tama_terminal_notifier` at a fixture instead.
        if: runner.os == 'macOS'
        run: brew install tmux bats-core jq
      - name: Install rush (parallel test runner)
        # Single static binary, no package manager needed on either image.
        # Pinned to the version validated locally (v0.5.4).
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=rush_linux_amd64.tar.gz ;;
            Darwin-arm64) asset=rush_darwin_arm64.tar.gz ;;
            *) echo "unsupported runner: $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/rushbin"
          curl -sL -o /tmp/rush.tgz "https://github.com/shenwei356/rush/releases/download/v0.5.4/$asset"
          tar xzf /tmp/rush.tgz -C "$RUNNER_TEMP/rushbin"
          echo "$RUNNER_TEMP/rushbin" >> "$GITHUB_PATH"
          # NOTE: $GITHUB_PATH only takes effect in subsequent steps, so verify
          # with the absolute path here; later steps (make test-shard) get it
          # via PATH.
          "$RUNNER_TEMP/rushbin/rush" --version
      - name: Report versions
        run: |
          tmux -V
          bats --version
          jq --version
          bash --version | head -1
          /bin/bash --version | head -1
      - run: make test-shard SHARD=${{ matrix.shard }} SHARDS=2 JOBS=4

  doctor:
    name: doctor (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Report version
        run: tmux -V
      - run: make doctor

  opencode:
    name: OpenCode integration (Bun 1.3.14)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: integrations/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
