name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: shellcheck
    # Pinned rather than ubuntu-latest: the suite needs bats >= 1.5, and which
    # bats `apt` has is a property of the image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - run: make lint

  test:
    name: bats
    # Pinned rather than ubuntu-latest: the suite needs bats >= 1.5, and which
    # bats `apt` has is a property of the image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bats
      - name: Report versions
        run: |
          tmux -V
          bats --version
      - run: make test
